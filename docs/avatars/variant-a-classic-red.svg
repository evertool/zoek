<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 背景: 深蓝 -->
  <rect width="1024" height="1024" rx="224" fill="#1A1A2E"/>

  <!-- 麻将牌主体 -->
  <rect x="312" y="200" width="400" height="540" rx="24" fill="#F5F0E6"/>
  <!-- 牌面凹陷阴影 -->
  <rect x="332" y="220" width="360" height="500" rx="16" fill="#FAF7F0"/>

  <!-- "中"字 - 红色 -->
  <text x="512" y="540"
    font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
    font-size="360" font-weight="900"
    fill="#E6533C"
    text-anchor="middle"
    dominant-baseline="central">中</text>

  <!-- 品牌名 -->
  <text x="512" y="830"
    font-family="'PingFang SC','Microsoft YaHei',sans-serif"
    font-size="52" font-weight="600"
    fill="#F5F0E6"
    text-anchor="middle"
    letter-spacing="8">雀友记</text>
</svg>
