<!DOCTYPE html>

<title>雀友记 — 头像设计预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px;
  }
  h1 { text-align: center; color: #1A1A2E; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; margin-bottom: 40px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .card h3 { color: #1A1A2E; margin-bottom: 4px; font-size: 18px; }
  .card .desc { color: #999; font-size: 12px; margin-bottom: 20px; }
  .card .sizes {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 16px;
    margin-top: 16px;
  }
  .card .sizes img { border-radius: 12px; }
  .card .sizes .label { font-size: 11px; color: #ccc; margin-top: 4px; }
  .size-wrap { text-align: center; }
</style>
</head>
