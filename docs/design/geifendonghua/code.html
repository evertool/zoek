"text-outline text-[10px]">22分钟前</span></div></div><div class="text-[16px] text-tertiary font-bold">-20</div></div></div></div><div class="sticky bottom-3 z-40 flex items-center justify-between gap-3 pt-1 pb-safe"><button class="flex-1 h-11 rounded-xl bg-surface-container-lowest shadow-md flex items-center justify-center gap-2 text-on-surface hover:bg-surface-container transition-all active:scale-98" onclick="openToolbox()" type="button"><span class="material-symbols-outlined text-secondary text-[18px]">auto_fix_high</span><span class="text-[13px] font-semibold">茶台道具盒</span></button><button class="flex-1 h-11 rounded-xl bg-surface-container-lowest shadow-md flex items-center justify-center gap-2 text-tertiary hover:bg-error-container/40 transition-all active:scale-98" onclick="confirmEndSession()" type="button"><span class="material-symbols-outlined text-tertiary text-[18px]">logout</span><span class="text-[13px] font-semibold">结束散台</span></button></div><div class="fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-xs items-center justify-center px-space-lg hidden" id="modal-qr"><div class="w-full max-w-xs bg-surface-container-lowest rounded-2xl p-space-lg flex flex-col items-center shadow-xl"><div class="flex items-center justify-between w-full mb-space-sm"><span class="font-headline-sm text-headline-sm text-on-surface font-semibold">出示台码给雀友</span><button class="text-outline hover:text-on-surface" id="btn-close-qr" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button></div><div class="w-48 h-48 rounded-xl bg-surface-container-low flex flex-col items-center justify-center p-3"><svg class="w-36 h-36 text-primary" fill="currentColor" viewbox="0 0 24 24"><path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm8-2h7v7h-7V3zm2 2v3h3V5h-3zM3 13h7v7H3v-7zm2 2v3h3v-3H5zm9-2h1v2h-1v-2zm3 0h3v1h-2v2h-1v-3zm-1 3h2v2h-2v-2zm-3 2h2v2h-2v-2zm4 0h2v2h-2v-2zm2-2h1v1h-1v-1zm-6-2h1v1h-1v-1z"></path></svg></div><span class="text-on-surface font-label-md text-label-md mt-space-sm font-semibold">房号：0842</span><span class="text-outline text-body-sm mt-1 text-center">微信扫一扫 · 自动落座未满席位</span><button class="mt-space-md w-full py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold text-center hover:bg-primary-container transition-colors" onclick="navigator.clipboard &amp;&amp; navigator.clipboard.writeText('https://dekai.club/r/0842'); showToast('台间链接已复制！')" type="button">复制邀请口令</button></div></div><div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-inverse-surface/90 text-inverse-on-surface text-label-md font-label-md shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none" id="toast-bar">已生成【西位】微信分享卡片</div></div><script>
const qrBtn = document.getElementById('btn-show-code');
const qrModal = document.getElementById('modal-qr');
const qrClose = document.getElementById('btn-close-qr');
const toastBar = document.getElementById('toast-bar');

let currentLkScore = 5;
let currentMeScore = -5;
let isTransferring = false;
let billCount = 7;

function showToast(text) {
  if (!toastBar) return;
  toastBar.innerText = text;
  toastBar.classList.remove('opacity-0', 'pointer-events-none');
  setTimeout(() => {
    toastBar.classList.add('opacity-0', 'pointer-events-none');
  }, 2000);
}

if (qrBtn && qrModal && qrClose) {
  qrBtn.addEventListener('click', () => { qrModal.classList.remove('hidden'); qrModal.classList.add('flex'); });
  qrClose.addEventListener('click', () => { qrModal.classList.add('hidden'); qrModal.classList.remove('flex'); });
  qrModal.addEventListener('click', (e) => { if (e.target === qrModal) { qrModal.classList.add('hidden'); qrModal.classList.remove('flex'); } });
}

function handleScoreTransfer(player, points) {
  animateCoinTransfer(points);
}

function animateCoinTransfer(amount = 10) {
  if (isTransferring) return;
  isTransferring = true;

  const startCard = document.getElementById('seat-card-me');
  const endCard = document.getElementById('seat-card-lk');
  const lkAvatarWrap = document.getElementById('avatar-lk-wrap');
  const lkScoreEl = document.getElementById('score-val-lk');
  const meScoreEl = document.getElementById('score-val-me');
  const billStream = document.getElementById('bill-stream');
  const billBadge = document.getElementById('bill-count-badge');

  if (!startCard || !endCard) {
    isTransferring = false;
    return;
  }

  const startRect = startCard.getBoundingClientRect();
  const endRect = endCard.getBoundingClientRect();

  // 起点：我（东位）头像中心
  const startX = startRect.left + startRect.width / 2;
  const startY = startRect.top + startRect.height / 3;

  // 终点：lk（北位）头像中心
  const endX = endRect.left + endRect.width / 2;
  const endY = endRect.top + endRect.height / 3;

  // 我方扣分即时气泡 (-10)
  const minusBadge = document.createElement('div');
  minusBadge.className = 'sink-score-minus px-2 py-0.5 rounded-full bg-error/90 text-on-error font-score-numeral text-[13px] shadow-md flex items-center gap-0.5 border border-white/40';
  minusBadge.innerHTML = `<span class="text-[11px]">-</span>${amount}`;
  startCard.appendChild(minusBadge);
  setTimeout(() => minusBadge.remove(), 1600);

  // 抛物线金币筹码群（4枚错峰发射）
  const coinCount = 4;
  const duration = 650; // ms

  for (let i = 0; i < coinCount; i++) {
    setTimeout(() => {
      const coin = document.createElement('div');
      coin.className = 'chip-particle';
      coin.innerHTML = '🀄';
      document.body.appendChild(coin);

      const startTime = performance.now();
      // 抛物线顶点偏移（向右上弧度弯曲）
      const arcHeight = -65 - Math.random() * 25;

      function updateCoin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // 缓动
        const ease = progress * progress; // 逐渐加速撞击
        const curX = startX + (endX - startX) * progress;
        // 抛物线高度计算
        const parabola = 4 * arcHeight * progress * (1 - progress);
        const curY = startY + (endY - startY) * progress + parabola;
        const rotate = progress * 720;
        const scale = 1 + Math.sin(progress * Math.PI) * 0.35;

        coin.style.left = `${curX - 11}px`;
        coin.style.top = `${curY - 11}px`;
        coin.style.transform = `rotate(${rotate}deg) scale(${scale})`;

        if (progress < 1) {
          requestAnimationFrame(updateCoin);
        } else {
          coin.remove();
          // 当最后一枚金币到达，触发吸收、加分和账单联动
          if (i === coinCount - 1) {
            onCoinsArrived(amount);
          }
        }
      }
      requestAnimationFrame(updateCoin);
    }, i * 90);
  }

  function onCoinsArrived(pts) {
    // 1. 头像 Q 弹反馈与波纹扩散
    if (lkAvatarWrap) {
      lkAvatarWrap.classList.remove('animate-avatar-bounce');
      void lkAvatarWrap.offsetWidth; // 触发 reflow
      lkAvatarWrap.classList.add('animate-avatar-bounce');

      // 翡翠金光波纹圈
      const ripple = document.createElement('div');
      ripple.className = 'absolute inset-0 rounded-full border-2 border-primary-fixed-dim bg-primary/20 pointer-events-none animate-pulse-ring z-0';
      lkAvatarWrap.appendChild(ripple);
      setTimeout(() => ripple.remove(), 900);
    }

    // 2. 飘升 +10 翡翠绿徽标
    const plusBadge = document.createElement('div');
    plusBadge.className = 'float-score-plus px-2.5 py-0.5 rounded-full bg-primary text-on-primary font-score-numeral text-[15px] font-bold shadow-lg flex items-center gap-0.5 border border-primary-fixed';
    plusBadge.innerHTML = `<span class="text-[12px] font-extrabold">+</span>${pts}`;
    endCard.appendChild(plusBadge);
    setTimeout(() => plusBadge.remove(), 1800);

    // 3. 数字变更
    currentLkScore += pts;
    currentMeScore -= pts;
    if (lkScoreEl) lkScoreEl.innerText = (currentLkScore >= 0 ? `+${currentLkScore}` : `${currentLkScore}`);
    if (meScoreEl) meScoreEl.innerText = (currentMeScore >= 0 ? `+${currentMeScore}` : `${currentMeScore}`);

    // 4. 流水账单追加一条并高亮闪烁
    billCount++;
    if (billBadge) billBadge.innerText = `共 ${billCount} 笔`;
    if (billStream) {
      const newRow = document.createElement('div');
      newRow.className = 'flex items-center justify-between p-1.5 rounded-xl hover:bg-surface-container-low transition-colors bill-highlight';
      newRow.innerHTML = `
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full overflow-hidden shadow-inner shrink-0">
            <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDU8GvwlX6azC1dIba5ZGPjeKA2j3SnTmIxx_TQAWGLWhcmD9cN4moVEWPGNvI9yKJfTzK6ZWzJWgnDvV4NnWU3tQG9nuCPFQACb-_HW8b7iltbGM_i9b2uDXkIZHdBBpLiPW85LOfHdNZihd5yUKTsN1r96TnfYZ1DNCWr3SN9Hk53tQJIfAzJNwMG15nZo-dXCaNpmVdYb7FrEMW-X4uDOadX-M0Vpkh7_Vt-h-jUK5Uu60OAc3fQeQ" alt="勿忘">
          </div>
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-1 text-on-surface text-[12px]">
              <span class="font-semibold text-on-surface-variant">我</span>
              <span class="material-symbols-outlined text-[12px] text-tertiary">arrow_forward</span>
              <span class="font-semibold text-primary">lk</span>
            </div>
            <span class="text-primary text-[10px] font-medium">刚刚记入</span>
          </div>
        </div>
        <div class="text-[16px] text-tertiary font-bold">-${pts}</div>
      `;
      billStream.insertBefore(newRow, billStream.firstChild);
    }

    showToast(`已成功转给【lk】 ${pts} 分`);
    setTimeout(() => {
      isTransferring = false;
    }, 400);
  }
}

function triggerInvite(seatName) {
  showToast(`已生成【${seatName}】微信分享卡片`);
}

function openToolbox() {
  showToast('🍵 道具盒已开启：给雀友斟茶中...');
}

function confirmEndSession() {
  if (window.confirm('确定结清并解散本桌牌局吗？')) {
    showToast('散台账单生成完毕，已归档');
  }
}
</script></main></body></html>
