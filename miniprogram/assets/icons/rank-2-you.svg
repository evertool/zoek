<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="16" y1="10" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7F5EE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="28" y1="24" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#4E8F72"/>
      <stop offset="1" stop-color="#6D4A12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- outer badge -->
  <path d="M16 31 L48 14 L80 31 L80 65 L48 82 L16 65 Z" fill="url(#bg)" stroke="#4E8F72" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M22 34 L48 20 L74 34 L74 62 L48 76 L22 62 Z" fill="none" stroke="#4E8F72" stroke-opacity=".24" stroke-width="1.5"/>

  <!-- small mahjong marks -->
  <circle cx="29" cy="36" r="2.2" fill="#4E8F72" opacity=".75"/>
  <circle cx="67" cy="36" r="2.2" fill="#4E8F72" opacity=".75"/>
  <circle cx="29" cy="60" r="2.2" fill="#4E8F72" opacity=".75"/>
  <circle cx="67" cy="60" r="2.2" fill="#4E8F72" opacity=".75"/>

  <!-- central tile -->
  <rect x="32" y="25" width="32" height="46" rx="6" fill="white" stroke="#4E8F72" stroke-width="2.2"/>
  <rect x="35.5" y="28.5" width="25" height="39" rx="4" fill="none" stroke="#4E8F72" stroke-opacity=".18"/>

  <!-- character -->
  <text x="48" y="56" text-anchor="middle"
        font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="22" font-weight="800" fill="#4E8F72">友</text>

  <!-- rank spark -->
  <path d="M48 17 L49.7 20.5 L53 22 L49.7 23.5 L48 27 L46.3 23.5 L43 22 L46.3 20.5 Z"
        fill="#4E8F72" opacity=".9"/>
</svg>