# 雀友记后端配置示例
# 将此文件复制为 config.yaml 并修改为实际值
# 环境变量覆盖优先级最高: ZOEK_<SECTION>_<FIELD>

server:
  port: "8080"
  mode: "release"           # debug | release | test
  shutdown_timeout: 10      # 优雅关闭超时（秒）

database:
  driver: "mysql"           # 仅支持 mysql
  host: "127.0.0.1"         # 数据库地址（线上填实际 IP 或域名）
  port: "3306"             # 端口
  user: "root"             # 用户名
  password: "your_password" # 密码（含特殊字符直接写即可）
  dbname: "zoek"           # 数据库名（需提前创建）
  log_level: "warn"         # silent | error | warn | info
  # charset=utf8mb4、parseTime=true、loc=Local 由程序自动拼接，无需配置
  # 环境变量覆盖: ZOEK_DB_HOST / ZOEK_DB_PORT / ZOEK_DB_USER / ZOEK_DB_PASSWORD / ZOEK_DB_NAME

wechat:
  appid: "your_appid"
  app_secret: "your_app_secret"
  # 环境变量覆盖: ZOEK_WECHAT_APPID / ZOEK_WECHAT_APP_SECRET

jwt:
  secret: "zoek-dev-secret-change-in-production"  # 生产环境务必修改！用 make jwt-secret 生成
  token_expiry: 168         # Token 有效期（小时），168 = 7 天

log:
  level: "info"             # debug | info | warn | error
  encoding: "json"          # json | console
  output: "stdout"         # stdout | stderr | /path/to/file.log

cors:
  allow_origins:
    - "*"
  # 生产环境应配置为具体域名：
  # - "https://your-domain.com"
